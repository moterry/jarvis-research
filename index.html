<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jarvis Research - 研究报告</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%); min-height: 100vh; color: #fff; }
        .container { max-width: 1200px; margin: 0 auto; padding: 40px 20px; }
        header { text-align: center; margin-bottom: 60px; }
        h1 { font-size: 3rem; margin-bottom: 20px; background: linear-gradient(90deg, #00d2ff, #3a7bd5); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .subtitle { font-size: 1.2rem; color: #8892b0; }
        .reports-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 30px; }
        .report-card { background: rgba(255, 255, 255, 0.05); border-radius: 16px; padding: 30px; border: 1px solid rgba(255, 255, 255, 0.1); transition: all 0.3s ease; text-decoration: none; color: inherit; display: block; }
        .report-card:hover { transform: translateY(-5px); border-color: #3a7bd5; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); }
        .report-card h2 { font-size: 1.5rem; margin-bottom: 15px; color: #fff; }
        .report-card p { color: #8892b0; line-height: 1.6; }
        .report-card .date { margin-top: 20px; font-size: 0.9rem; color: #64ffda; }
        .tag { display: inline-block; background: rgba(100, 255, 218, 0.2); color: #64ffda; padding: 3px 10px; border-radius: 12px; font-size: 0.8rem; margin-bottom: 10px; }
        .footer { text-align: center; margin-top: 80px; padding-top: 40px; border-top: 1px solid rgba(255, 255, 255, 0.1); color: #8892b0; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔬 Jarvis Research</h1>
            <p class="subtitle">莫哥的研究报告库</p>
        </header>
        <div class="reports-grid">
            <a href="keyboard-mouse-report-v3.html" class="report-card">

                <p>全尺寸带数字小键盘 | 3台设备切换 | 静音 | 预算1000-1500元</p>
                <div class="date">2026-02-26</div>
            </a>
        </div>
        <footer><p>Powered by Jarvis 🤖</p></footer>
    </div>
</body>
</html>
